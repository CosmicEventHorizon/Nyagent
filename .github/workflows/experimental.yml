name: Experimental Debug APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 33 packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk_root: $ANDROID_HOME"
          yes | "$SDKMGR" --licenses --channel=0 --sdk_root="$ANDROID_HOME"
          yes | "$SDKMGR" --channel=0 --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;33.0.1"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Compute version
        run: |
          BUILD_NUM="$(git rev-list --count HEAD)"
          echo "APP_VERSION_NAME=1.0.${BUILD_NUM}-experimental" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((BUILD_NUM * 10 + 5))" >> "$GITHUB_ENV"

      - name: Set up signing
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE_B64" ]; then
            echo "$SIGNING_STORE_B64" | base64 -d > "${{ runner.temp }}/nyagent.p12"
            echo "SIGNING_STORE=${{ runner.temp }}/nyagent.p12" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "Signing enabled."
          else
            echo "Signing with committed keystore."
          fi

      - name: Build experimental debug APK
        run: ./gradlew app:buildDebug app:packageDebug app:assembleDebug

      - name: Package APK
        run: |
          SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SOURCE" "latest-${APP_VERSION_NAME}.apk"
          ls -la latest-*.apk

      - name: Ensure experimental tag exists
        run: |
          git tag -f experimental HEAD
          git push -f origin experimental || echo "tag push failed (may already exist on remote)"

      - name: Ensure experimental release exists
        id: ensure_release
        run: |
          if gh release view experimental >/dev/null 2>&1; then
            echo "experimental release already exists"
          else
            gh release create experimental \
              --title "Nyagent Experimental" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Create experimental release (fallback)
        if: ${{ steps.ensure_release.conclusion == 'failure' }}
        run: |
          gh release create experimental \
            --title "Nyagent Experimental"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update experimental release description
        run: |
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          BUILD_NUM="$(git rev-list --count HEAD)"
          gh release edit experimental --notes "Latest experimental build v${APP_VERSION_NAME} (build ${BUILD_NUM}) from commit ${GITHUB_SHA:0:7} -- ${COMMIT_URL}. Replaced on every push to main; may be unstable."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Replace experimental APK
        run: |
          ASSET_IDS=$(gh release view experimental --json assets --jq '.assets[].id')
          for id in $ASSET_IDS; do
            echo "Deleting experimental asset id: $id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" || true
          done
          gh release upload experimental "latest-${APP_VERSION_NAME}.apk"
        env:
          GH_TOKEN: ${{ github.token }}

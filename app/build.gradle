plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pirouette.nyagent'
    compileSdk 33

    def signingEnabled = true

    signingConfigs {
        nyagent {
            def store = System.getenv('SIGNING_STORE') ?: rootProject.file('keystore/nyagent-release.jks').path
            storeFile file(store)
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: '59a6c4469aa9ffef2c3f3076a7cd3551'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'nyagent'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'fb55c0cd5e0ea2dc452be1da40a2b96f'
        }
    }

    defaultConfig {
        applicationId "com.pirouette.nyagent"
        minSdk 24
        targetSdk 33
        versionCode System.getenv('APP_VERSION_CODE') ? Integer.parseInt(System.getenv('APP_VERSION_CODE')) : 1
        versionName System.getenv('APP_VERSION_NAME') ?: "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingEnabled) {
                signingConfig signingConfigs.nyagent
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (signingEnabled) {
                signingConfig signingConfigs.nyagent
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.cardview:cardview:1.0.0'




}
